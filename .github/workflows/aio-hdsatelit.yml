name: AIO Panel HD Satelit hds2 - pakiety feed

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: aio-hdsatelit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-hdsatelit:
    if: ${{ !contains(github.ref_name, '+hds') && !contains(github.ref_name, '-hds') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pobierz dokładny commit / tag
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sprawdź zgodność taga z kodem
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < version.txt)"
          test -n "$VERSION"
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            TAG="${GITHUB_REF_NAME#v}"
            test "$TAG" = "$VERSION" || { echo "Niezgodny tag $TAG vs version.txt $VERSION"; exit 1; }
          fi

      - name: Zbuduj standardowy IPK z bieżących źródeł
        run: sh build_ipk.sh

      - name: Budowanie wersji wyłącznie dla HD Satelit
        run: python3 tools/build_hdsatelit_ci.py --source . --out dist-hdsatelit

      - name: Oryginalne testy profilu HD Satelit
        run: python3 tools/test_hdsatelit.py --out dist-hdsatelit

      - name: Niezależne testy dwóch pakietów i ograniczeń
        run: python3 tools/test_hdsatelit_ci.py --out dist-hdsatelit

      - name: Testy regresji i eksport dla BitBake bez dpkg-deb
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_hds2_maintenance.py
          AIO_PYTHON="$(command -v python3)"
          AIO_AR_DIR="$(mktemp -d)"
          ln -s "$(command -v ar)" "$AIO_AR_DIR/ar"
          PATH="$AIO_AR_DIR" "$AIO_PYTHON" tools/build_hdsatelit_ci.py --source-only
          (cd dist-hdsatelit-source && sha256sum --check SHA256SUMS.txt)

      - name: Ponowna kontrola wyników SHA256
        run: |
          cd dist-hdsatelit
          sha256sum --check SHA256SUMS.txt

      - name: Udostępnij artefakty GitHub Actions do publikacji w Releases
        uses: actions/upload-artifact@v4
        with:
          name: AIO-Panel-HD-Satelit-hds2-${{ github.ref_name }}
          path: |
            dist-hdsatelit/*.ipk
            dist-hdsatelit/*.deb
            dist-hdsatelit/aio-panel-hdsatelit-source.zip
            dist-hdsatelit/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
